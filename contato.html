<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="media/icons/logo1.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Loma Tech - Contato</title>
</head>
<body>
    <div class="planoDeFundo"></div>

    <header>
        <img src="media/imgs/logo.webp" alt="Logo da Loma Tech">
        <nav>
            <ul>
                <li><a href="index.html">Hero</a></li>
                <li><a href="solucoes.html">Soluções</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contato.html" class="atual">Contato</a></li>
            </ul>
        </nav>
        <img class="hamburguer" src="media/imgs/menu.png" alt="Menu estilo hamburguer">
    </header>

    <main>
        <h2 class="tituloContato fundoChamativo">Entre em <span class="tituloPersonalizado">Contato</span></h2>

        <section id="agendarContato">
            <div class="agenda">
                <h3>Agenda uma Reunião</h3>

                <img src="media/imgs/Captura de ecrã 2026-03-11 144558.png" alt="Agenda para agendar uma reunião">
            </div>

            <div class="separador">ou</div>

            <div class="formulario">
                <h3>Preencha o Formulário</h3>

                <form>
                    <div class="inputs">
                        <input type="text" name="nome" placeholder="Nome" maxlength="50" autocomplete="name" required>

                        <input type="tel" name="telefone" placeholder="Telefone" autocomplete="tel" maxlength="20">

                        <input type="email" name="email" placeholder="E-mail" maxlength="50" autocomplete="email" required>

                        <input type="text" name="imobiliaria" placeholder="Imobiliária" maxlength="20">
                    </div>

                    <textarea name="mensagem" placeholder="Mensagem" maxlength="200"></textarea>

                    <button type="submit">ENVIAR INFORMAÇÕES</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="superior">
            <img src="media/imgs/logo-footer.webp" alt="Logo da lomaTech">
            <div class="links">
                <div class="institucional">
                    <h4>Institucional</h4>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="solucoes.html">Soluções</a></li>
                        <li><a href="blog.html">Blog</a></li>
                        <li><a href="contato.html">Contato</a></li>
                    </ul>
                </div>
                <div class="blog">
                    <h4>Blog</h4>
                    <ul>
                        <li><a href="blog.html">Últimas notícias</a></li>
                        <li><a href="blog.html">Top notícias</a></li>
                    </ul>
                </div>
                <div class="contato">
                    <h4>Contate-nos</h4>
                    <a class="botao" href="contato.html">ENTRE EM CONTATO</a>
                </div>
            </div>
        </div>
        <div class="inferior">
            <p>
                Lomatech.io 2024 | © Todos direitos reservados
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
